[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-to-work-harness"
version = "0.5.0"
description = "Reviewed project scopes, shared controls and escalation for local agents"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "packaging>=24.2,<27", "cvss==3.6", "mcp==2.2.0", "PyYAML==6.0.3"]

[project.scripts]
ptw = "ptw.cli:main"

[tool.setuptools]
packages = ["ptw"]

[tool.setuptools.package-data]
ptw = ["demo_support/*.py", "release_data/*.json", "release_data/*.txt", "release_data/*.toml", "release_data/*.lock"]
