<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workshops</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f6f4ef;
        color: #24211d;
      }
      body {
        max-width: 48rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      main {
        padding: 2rem;
        border: 1px solid #d8d2c7;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.75rem 2rem rgb(55 45 30 / 8%);
      }
      h1 { margin-top: 0; }
      label {
        display: grid;
        gap: 0.5rem;
        max-width: 20rem;
        font-weight: 650;
      }
      select {
        padding: 0.75rem;
        border: 1px solid #91897c;
        border-radius: 0.5rem;
        background: white;
        font: inherit;
      }
      footer {
        padding: 1.5rem 0;
        text-align: center;
        color: #655e54;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Workshops</h1>
      <label for="category">
        Category
        <select id="category" name="category">
          <option value="all">All categories</option>
          <option value="coding">Coding</option>
          <option value="art">Art</option>
          <option value="design">Design</option>
        </select>
      </label>
    </main>
    <footer>Community workshops</footer>
  </body>
</html>
