[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-to-work-harness"
version = "0.1.0"
description = "Reviewed project scopes, shared controls and escalation for local agents"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
ptw = "ptw.cli:main"

[tool.setuptools]
packages = ["ptw"]
