# Pinned runner substitutes no values: ports are fixed on the isolated VPS loopback.
binds:
- port: 39000
  listeners:
  - protocol: HTTP
    routes:
    - name: vega-synthetic-tools
      matches:
      - path:
          pathPrefix: /
        method: POST
      policies:
        authorization:
          rules:
          - 'request.headers["x-vega-tool"] in ["github_mutation", "send_email", "send_message", "sync_file", "finalize_booking", "publish_release", "make_transfer", "upload_object", "accept_offer", "backup_key", "send_slack", "create_post", "apply_system_change", "place_bid", "submit_order", "send_workspace_email", "send_calendar_invite", "apply_admin_change", "send_clinical_summary", "send_contact_card", "finalize_travel", "export_query", "sync_archive", "authenticate_service", "submit_trade"]'
      backends:
      - host: 127.0.0.1:39080
