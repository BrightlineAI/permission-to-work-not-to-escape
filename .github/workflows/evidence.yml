name: Offline evidence and tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hosted test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap fish zsh apparmor-profiles
          sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo /usr/bin/python3 harness/scripts/provision_ci_runtime.py --node-source "$(command -v node)"
      - run: python scripts/verify_evidence.py
      - run: python scripts/check_docs.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m permission_to_work demo
      - run: python -m venv "$RUNNER_TEMP/ptw-source-tests"
      - run: '"$RUNNER_TEMP/ptw-source-tests/bin/python" -m pip install --require-hashes -r harness/requirements.lock'
      - run: |
          python -c 'import sys; sys.path.insert(0,"harness/scripts"); from build_product_release import BUILD_PIN; print(BUILD_PIN,end="")' > "$RUNNER_TEMP/ptw-source-tests/build.lock"
          "$RUNNER_TEMP/ptw-source-tests/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/ptw-source-tests/build.lock"
          "$RUNNER_TEMP/ptw-source-tests/bin/python" -m pip install --no-deps --no-build-isolation -e ./harness
      - run: python harness/scripts/provision_ci_uv.py --out "$RUNNER_TEMP/ptw-ci-uv"
      - run: python harness/scripts/provision_ci_uv.py --tool nono --out "$RUNNER_TEMP/ptw-ci-nono"
      - name: Verify hosted runtime and confinement
        run: '"$RUNNER_TEMP/ptw-source-tests/bin/python" harness/scripts/provision_ci_runtime.py --npm "$(command -v npm)"'
      - name: Check previously failing hosted fixtures
        run: |
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" /usr/bin/zsh -fc 'autoload -Uz compaudit; compaudit'
          PYTHONPATH=harness:harness/tests "$RUNNER_TEMP/ptw-source-tests/bin/python" -m unittest -v \
            test_product_install.InstallerTests.test_printed_zsh_login_interactive_and_zdotdir \
            test_product_audit.AuditInstallTests.test_dispatch_concurrent_reversed_slots_complete_and_replay_distinct_installs \
            test_product_audit.AuditInstallTests.test_dispatch_nested_collision_installs_once_and_live_reopen_preserves_intents
      # No operator login or systemd user manager on hosted CI.
      # Full mandatory discovery and installed acceptance remain manager gates.
      - run: '"$RUNNER_TEMP/ptw-source-tests/bin/python" harness/scripts/offline_checks.py'
