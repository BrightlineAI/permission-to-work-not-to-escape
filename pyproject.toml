[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-to-work"
version = "0.1.0"
description = "Experimental policy compilation, permission diagnostics and shared job enforcement for AI agents"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Allister Lundberg"}]
dependencies = []

[project.scripts]
permission-to-work = "permission_to_work.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
permission_to_work = ["examples/*.json"]
